<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Event Registration</h1>
    <p class="subtitle">Save your spot — it only takes a minute.</p>

    <form id="registration-form" novalidate>

      <div class="edit-banner hidden" id="edit-banner" role="status">
        <span>Editing registration for <strong id="edit-name"></strong></span>
        <button type="button" class="btn-link" id="cancel-edit">Cancel</button>
      </div>

      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" aria-describedby="fullName-error">
        <p class="error" id="fullName-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error">
        <p class="error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="eventDate">Event date</label>
        <input type="date" id="eventDate" name="eventDate" aria-describedby="eventDate-error">
        <p class="error" id="eventDate-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="guests">Number of guests</label>
        <input type="number" id="guests" name="guests" min="1" max="10" step="1" inputmode="numeric" aria-describedby="guests-error">
        <p class="error" id="guests-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="dietary">Dietary restrictions <span class="optional">(optional)</span></label>
        <textarea id="dietary" name="dietary" placeholder="e.g. vegetarian, nut allergy"></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="submit-button">Register</button>
        <button type="reset" class="btn-secondary">Reset</button>
      </div>
    </form>

    <section id="confirmation" class="confirmation hidden" role="status">
      <h2 id="confirmation-heading">You're registered! 🎉</h2>
      <dl class="details" id="confirmation-details"></dl>
    </section>

    <section class="registrations" aria-labelledby="registrations-heading">
      <h2 id="registrations-heading">
        Registrations <span class="count" id="registration-count"></span>
      </h2>

      <div class="toolbar">
        <label for="search" class="visually-hidden">Search registrations</label>
        <input type="search" id="search" class="search-input" placeholder="Search by name, email, or date…" autocomplete="off">
        <div class="toolbar-buttons">
          <button type="button" class="btn-small btn-outline-amber" id="export-button">Export JSON</button>
          <button type="button" class="btn-small btn-outline-pink" id="clear-all-button">Clear all</button>
        </div>
      </div>

      <ul class="registration-list" id="registration-list"></ul>
      <p class="empty-message hidden" id="empty-message">No registrations yet</p>
      <p class="empty-message hidden" id="no-matches"></p>
    </section>
  </main>

  <dialog class="modal" id="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-text">
    <h2 id="confirm-dialog-title"></h2>
    <p id="confirm-dialog-text"></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="confirm-cancel" autofocus>Cancel</button>
      <button type="button" class="btn-danger" id="confirm-ok"></button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
